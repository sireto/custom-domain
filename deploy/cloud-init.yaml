#cloud-config
# Custom Domain on a fresh cloud server (Ubuntu 22.04/24.04 or Debian 12).
# Paste this as the server's user data ("cloud config" on Hetzner Cloud,
# "user data" on DigitalOcean), after editing the values under write_files.
# It downloads deploy/install.sh and the Compose file from this repository
# at the release named by CUSTOM_DOMAIN_VERSION and runs it: Docker, the
# production Compose layout, generated secrets, the firewall, and a
# `custom-domain` command on the host. Progress and the final summary are
# in /var/log/custom-domain-install.log. A release is one version number
# (for example 0.3.1): the git tag, the image tag and the SDK version are
# the same, so a user-data document never runs code newer than the release
# it names. Walkthroughs: docs/hosting-hetzner.md, docs/hosting-digitalocean.md.
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - ufw

write_files:
  - path: /etc/custom-domain-install.env
    permissions: "0600"
    content: |
      # Contact for the certificate authority (Let's Encrypt), recommended.
      ACME_EMAIL=ops@example.net
      # The edge's own DNS name: point it at this server. It is the default
      # CNAME target for applications, gets a certificate, and serves the
      # portal from the first start.
      EDGE_HOSTNAME=edge.example.net
      # The release to install (git tag, image tag and SDK version are one
      # number). Change it to upgrade a new server; "latest" follows main.
      CUSTOM_DOMAIN_VERSION=0.4.1
      # Set to 1 when the provider's firewall is used instead of ufw.
      SKIP_FIREWALL=0
      # Addresses or networks that may open the portal at https://<edge name>/portal.
      # Comment out to reach it only over an SSH tunnel.
      PORTAL_ALLOWED_IPS=203.0.113.9

runcmd:
  - [sh, -c, ". /etc/custom-domain-install.env; ref=\"${CUSTOM_DOMAIN_REF:-${CUSTOM_DOMAIN_VERSION:-main}}\"; [ \"$ref\" = latest ] && ref=main; curl -fsSL \"https://raw.githubusercontent.com/sireto/custom-domain/${ref}/deploy/install.sh\" -o /root/custom-domain-install.sh"]
  - [sh, -c, "bash /root/custom-domain-install.sh >/var/log/custom-domain-install.log 2>&1"]

final_message: "Custom Domain installed after $UPTIME seconds; see /var/log/custom-domain-install.log"
