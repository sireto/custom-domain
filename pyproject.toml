[project]
name = "custom-domain"
version = "0.4.1"
description = "API-first custom domain service for multi-tenant SaaS, backed by Caddy."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "alembic>=1.20.0",
    "dnspython>=2.8.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "idna>=3.20",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "publicsuffixlist>=1.0.2.20260925",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
    "validators>=0.35.0",
]

[project.scripts]
custom-domain = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.workspace]
members = ["sdk"]

[tool.uv.sources]
custom-domain-sdk = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette 1.x prefers httpx2 for its test client; httpx 0.28 still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI's Depends()/Security() in parameter defaults is the intended pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prototype Caddy modules are replaced by #1 and #7; not restyled meanwhile.
"app/caddy/*" = ["E501", "SIM108"]

[dependency-groups]
dev = [
    "custom-domain-sdk",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
