[project]
name = "custom-domain-sdk"
version = "0.6.1"
description = "Client, assertion verification and middleware for the Custom Domain API."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sireto", email = "info@sireto.com" }]
keywords = [
    "custom-domain",
    "custom-domains",
    "saas",
    "multi-tenant",
    "multi-tenancy",
    "white-label",
    "caddy",
    "tls",
    "asgi",
    "fastapi",
    "starlette",
    "webhooks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/sireto/custom-domain"
Documentation = "https://github.com/sireto/custom-domain/blob/main/sdk/README.md"
Source = "https://github.com/sireto/custom-domain/tree/main/sdk"
Issues = "https://github.com/sireto/custom-domain/issues"
Changelog = "https://github.com/sireto/custom-domain/releases"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_domain"]

[tool.hatch.build.targets.sdist]
include = ["custom_domain", "README.md", "LICENSE", "pyproject.toml"]
