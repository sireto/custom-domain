[project]
name = "custom-domain-sdk"
version = "0.1.0"
description = "Client, assertion verification and middleware for the Custom Domain API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_domain"]
