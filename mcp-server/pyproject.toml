[project]
name = "custom-domain-mcp"
version = "0.11.1"
description = "MCP server for the Custom Domain API: let an AI assistant register and check your customers' hostnames."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sireto", email = "info@sireto.com" }]
keywords = ["mcp", "model-context-protocol", "custom-domain", "custom-domains", "saas", "multi-tenant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["custom-domain-sdk>=0.10.0", "mcp>=2.3,<3"]

[project.scripts]
custom-domain-mcp = "custom_domain_mcp.server:main"

[project.urls]
Homepage = "https://customdomainapi.com"
Documentation = "https://github.com/sireto/custom-domain/blob/main/mcp-server/README.md"
Source = "https://github.com/sireto/custom-domain/tree/main/mcp-server"
Issues = "https://github.com/sireto/custom-domain/issues"

[tool.uv.sources]
custom-domain-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_domain_mcp"]
