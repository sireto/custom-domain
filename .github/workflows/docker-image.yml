# Builds the service image and publishes it to GitHub Container Registry as
# ghcr.io/sireto/custom-domain, authenticated with the workflow's own token
# (no registry secrets). Tags: `latest` and `sha-<commit>` for every push to
# main, `<version>` and `<major>.<minor>` for a release tag `v<version>`.
# Pull requests build the image to catch Dockerfile breakage but push nothing.
name: Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker-image.yml

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=custom-domain
            org.opencontainers.image.description=Custom domains for multi-tenant SaaS: API, lifecycle worker and Caddy edge
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Attest the build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
