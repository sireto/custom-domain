# Publishes the custom-domain-sdk and custom-domain-mcp packages to PyPI with
# Trusted Publishing:
# GitHub mints a short-lived OIDC token for this workflow and PyPI accepts it
# for the configured publisher (owner sireto, repository custom-domain, this
# workflow file, environment "pypi"; one publisher per PyPI project). No API
# token is stored anywhere. One release tag (a plain version such as 0.3.1)
# releases the SDK, the MCP server and the service image together at the same
# version. See docs/deployment.md,
# "Releasing".
name: Publish SDK

on:
  push:
    tags: ["[0-9]*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish a manual run (the tag push always targets PyPI)
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check that the tag is the version everywhere
        if: github.ref_type == 'tag'
        run: |
          service=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          sdk=$(uv run python -c "import tomllib; print(tomllib.load(open('sdk/pyproject.toml','rb'))['project']['version'])")
          mcp=$(uv run python -c "import tomllib; print(tomllib.load(open('mcp-server/pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "${service}" && test "${GITHUB_REF_NAME}" = "${sdk}" && test "${GITHUB_REF_NAME}" = "${mcp}" \
            || { echo "tag ${GITHUB_REF_NAME} must equal pyproject.toml (${service}), sdk/pyproject.toml (${sdk}) and mcp-server/pyproject.toml (${mcp})"; exit 1; }
      - name: Test the SDK
        run: uv run pytest tests/test_sdk.py tests/test_assertion.py
      - name: Build distributions
        run: uv build --package custom-domain-sdk --out-dir dist
      - name: Check distributions
        run: uvx twine check --strict dist/*
      - name: Check that the built package reports the tag as its version
        if: github.ref_type == 'tag'
        run: |
          uv venv --quiet /tmp/sdk-check
          VIRTUAL_ENV=/tmp/sdk-check uv pip install --quiet dist/*.whl
          runtime=$(/tmp/sdk-check/bin/python -c "import custom_domain, custom_domain.client as c; print(custom_domain.__version__, c.USER_AGENT)")
          test "${runtime}" = "${GITHUB_REF_NAME} custom-domain-sdk/${GITHUB_REF_NAME}" \
            || { echo "built package reports '${runtime}', tag is ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: dist/
          if-no-files-found: error

  # The MCP server builds and publishes on its own, so a failure here never
  # stops the SDK (or the other way round).
  build-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check that the tag is the version
        if: github.ref_type == 'tag'
        run: |
          mcp=$(uv run python -c "import tomllib; print(tomllib.load(open('mcp-server/pyproject.toml','rb'))['project']['version'])")
          listing=$(uv run python -c "import json; d=json.load(open('mcp-server/server.json')); print(d['version'], d['packages'][0]['version'])")
          test "${GITHUB_REF_NAME}" = "${mcp}" && test "${listing}" = "${GITHUB_REF_NAME} ${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} must equal mcp-server/pyproject.toml (${mcp}) and mcp-server/server.json (${listing})"; exit 1; }
      - name: Test the MCP server
        run: uv run pytest tests/test_mcp_server.py
      - name: Build distributions
        run: uv build --package custom-domain-mcp --out-dir dist-mcp
      - name: Check distributions
        run: uvx twine check --strict dist-mcp/*
      - name: Check that the built package reports the tag as its version
        if: github.ref_type == 'tag'
        run: |
          uv venv --quiet /tmp/mcp-check
          VIRTUAL_ENV=/tmp/mcp-check uv pip install --quiet dist-mcp/*.whl
          runtime=$(/tmp/mcp-check/bin/python -c "import custom_domain_mcp; print(custom_domain_mcp.__version__)")
          test "${runtime}" = "${GITHUB_REF_NAME}" \
            || { echo "built package reports '${runtime}', tag is ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-dist
          path: dist-mcp/
          if-no-files-found: error

  publish-pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/custom-domain-sdk/
    permissions:
      id-token: write   # Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  # Its own build and publish jobs: the SDK is published even if these fail
  # (for example before the PyPI project's trusted publisher is set up).
  publish-mcp-pypi:
    if: github.ref_type == 'tag'
    needs: build-mcp
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/custom-domain-mcp/
    permissions:
      id-token: write   # Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcp-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  # Lists the released version on the MCP Registry (registry.modelcontextprotocol.io),
  # which MCP clients and directories read. GitHub OIDC proves the io.github.sireto/
  # namespace, so no token is stored; the registry checks the package on PyPI
  # for the mcp-name line in its README.
  publish-mcp-registry:
    if: github.ref_type == 'tag'
    needs: publish-mcp-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # MCP Registry login (OIDC)
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish mcp-server/server.json
        run: |
          # PyPI can take a minute to serve a new release to the registry's check.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish mcp-server/server.json && exit 0
            sleep $((attempt * 30))
          done
          exit 1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/custom-domain-sdk/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          print-hash: true
          skip-existing: true
