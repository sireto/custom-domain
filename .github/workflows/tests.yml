name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: custom_domain
          POSTGRES_PASSWORD: custom_domain
          POSTGRES_DB: custom_domain_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U custom_domain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Build Caddy with the image's modules
        # The same release and modules as the Dockerfile, so the edge tests
        # exercise what production runs (rate limits included).
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7
          "$(go env GOPATH)/bin/xcaddy" build v2.11.4 \
            --with github.com/pberkel/caddy-storage-redis \
            --with github.com/mholt/caddy-ratelimit@5625512f24f6 \
            --output /tmp/caddy
          sudo install -m 0755 /tmp/caddy /usr/local/bin/caddy
          caddy version
          caddy list-modules | grep -q http.handlers.rate_limit
      - name: Lint
        run: uv run ruff check app tests
      - name: Test on SQLite
        run: uv run pytest
        env:
          REQUIRE_CADDY: "1"
      - name: Test on PostgreSQL
        run: uv run pytest
        env:
          REQUIRE_CADDY: "1"
          TEST_DATABASE_URL: postgresql+psycopg://custom_domain:custom_domain@localhost:5432/custom_domain_test
